plugins {
    id 'base'
}

def nodeExecutable = providers.gradleProperty('nodeExecutable').orElse('node')
def releaseProfile = providers.gradleProperty('releaseProfile')
def releaseRequested = gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['releaseCheck', 'releaseCheckP3'] }
if (releaseProfile.isPresent() && releaseProfile.get() != 'P3') throw new GradleException('Unknown release profile; supported: P3')
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'releaseCheck' } && releaseProfile.getOrElse('') != 'P3') throw new GradleException('releaseCheck requires -PreleaseProfile=P3; alternatively use releaseCheckP3')
if (releaseRequested) {
    providers.exec {
        workingDir rootProject.projectDir
        commandLine nodeExecutable.get(), rootProject.file('tools/release/evidence.cjs'), '--preflight'
    }.result.get().assertNormalExitValue()
}

tasks.register('checkNodeRuntime') {
    group = 'verification'
    description = 'Checks the pinned Node runtime before portable tests and benchmarks.'
    doLast {
        def actual = providers.exec {
            commandLine nodeExecutable.get(), '--version'
        }.standardOutput.asText.get().trim()
        def expected = "v${providers.gradleProperty('nodeVersion').get()}"
        if (actual != expected) {
            throw new GradleException("Node ${expected} required, found ${actual}. "
                    + "Set -PnodeExecutable=/path/to/node. Node 22 can hang in V8 WasmGC compilation.")
        }
    }
}

allprojects {
    group = 'guru.interlis'
    version = providers.gradleProperty('projectVersion').get()
}

subprojects { sub ->
    sub.tasks.matching { it.name in ['wasmContractTest', 'jsContractTest',
            'browserContractTest', 'safariContractTest', 'diagramAdapterTest', 'browserClientTest', 'buildBrowserTools',
            'webImageProbe', 'webImageBrowserTest'] }.configureEach {
        dependsOn rootProject.tasks.named('checkNodeRuntime')
        // Keep functional deadlines independent of competing compiler/native-image
        // builds and reference JVMs. Ordering does not select additional tasks.
        mustRunAfter ':conformanceCheck', ':interlis-wasm-webimage:webImageBuild',
                ':interlis-wasm-teavm:generateJavaScript', ':interlis-wasm-teavm:generateWasmGC'
        def previousProbe = [
                wasmContractTest: ':interlis-wasm-teavm:jsContractTest',
                webImageProbe: ':interlis-wasm-teavm:wasmContractTest',
                webImageBrowserTest: ':interlis-wasm-webimage:webImageProbe',
                browserContractTest: ':interlis-wasm-webimage:webImageBrowserTest',
                safariContractTest: ':interlis-wasm-teavm:browserContractTest'
        ][name]
        if (previousProbe) mustRunAfter previousProbe
    }
    sub.plugins.withId('java') {
        rootProject.tasks.named('check').configure {
            dependsOn "${sub.path}:check"
        }
    }
}

tasks.register('checkPortable') {
    group = 'verification'
    description = 'JVM checks plus the portable TeaVM WasmGC and JavaScript Node profiles.'
    dependsOn tasks.named('check')
    def teavm = subprojects.find { it.name == 'interlis-wasm-teavm' }
    if (teavm != null) {
        dependsOn "${teavm.path}:wasmContractTest"
        dependsOn "${teavm.path}:jsContractTest"
        dependsOn "${teavm.path}:diagramAdapterTest"
    }
}

tasks.register('checkBrowser') {
    group = 'verification'
    description = 'Runs the real browser matrix when the pinned browsers are available; fails if not run.'
    def browserModule = subprojects.find { it.name == 'interlis-wasm-teavm' }
    if (browserModule != null) {
        dependsOn "${browserModule.path}:browserContractTest"
        dependsOn "${browserModule.path}:uiProjectionTest"
        dependsOn "${browserModule.path}:safariContractTest"
        def webimage = subprojects.find { it.name == 'interlis-wasm-webimage' }
        if (webimage != null) {
            dependsOn "${webimage.path}:webImageBrowserTest"
        }
    }
}

tasks.register('releaseCheckP3') {
    group = 'verification'
    description = 'P3 release profile including conformance, performance and platform evidence.'
    dependsOn 'conformanceCheck', 'performanceCheck'
    dependsOn tasks.named('check')
    dependsOn tasks.named('checkPortable')
    dependsOn tasks.named('checkBrowser')
    dependsOn tasks.named('sdkProcessCheck')
    dependsOn tasks.named('sdkPackage')
    def webimage = subprojects.find { it.name == 'interlis-wasm-webimage' }
    if (webimage != null) {
        dependsOn "${webimage.path}:webImageProbe"
    }
}


apply from: 'gradle/conformance.gradle'

apply from: 'gradle/evidence.gradle'

apply from: 'gradle/host-verification.gradle'

tasks.register('g2EvidenceTest') {
    group = 'verification'
    description = 'Checks G2 source inventory, frozen review inputs and evidence failure paths.'
    dependsOn ':interlis-cli:evidenceTest'
}
tasks.named('check') { dependsOn 'g2EvidenceTest' }



tasks.register('wasmBenchmark', Exec) {
    dependsOn 'geoCorpus', 'checkNodeRuntime'
    group = 'verification'
    description = 'Runs the pinned geo corpus through TeaVM WasmGC.'
    dependsOn ':interlis-wasm-teavm:buildWasmGC'
    workingDir = rootProject.projectDir
    commandLine nodeExecutable.get(), 'interlis-wasm-teavm/wasm-benchmark.cjs'

}

tasks.register('browserBenchmark', Exec) {
    dependsOn 'geoCorpus', 'checkNodeRuntime'
    group = 'verification'
    description = 'Runs the pinned geo corpus through Playwright browsers.'
    dependsOn ':interlis-wasm-teavm:prepareBrowserHarness'
    workingDir = rootProject.projectDir
    commandLine nodeExecutable.get(), 'interlis-wasm-teavm/browser-benchmark.cjs'
}

// The historical 13-root benchmark tasks remain individually reproducible.
// P3 requires the complete pinned closure profile with no browser exceptions.
tasks.register('fullCorpusWasm', Exec) {
    dependsOn 'fullCorpusJvm', 'checkNodeRuntime', ':interlis-wasm-teavm:buildWasmGC'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), 'tools/performance/full-corpus-node.cjs'
}
tasks.register('fullCorpusBrowsers', Exec) {
    dependsOn 'fullCorpusWasm', ':interlis-wasm-teavm:prepareBrowserHarness'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), 'tools/performance/full-corpus-browser.cjs'
}
tasks.register('fullCorpusSafari', Exec) {
    dependsOn 'fullCorpusBrowsers'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), 'tools/performance/full-corpus-browser.cjs', 'safari'
}
tasks.register('fullCorpusEditorWasm', Exec) {
    dependsOn 'fullCorpusSafari', 'fullCorpusArtifacts'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), 'tools/performance/editor-node.cjs'
}
tasks.register('fullCorpusArtifacts', Exec) {
    dependsOn ':interlis-wasm-teavm:prepareBrowserHarness', 'checkNodeRuntime'
    workingDir rootProject.projectDir
    mustRunAfter 'fullCorpusSafari'
    commandLine nodeExecutable.get(), 'tools/performance/artifacts.cjs'
}
tasks.register('performanceCheckerTest', Exec) {
    dependsOn 'checkNodeRuntime'
    workingDir rootProject.projectDir
    mustRunAfter 'observationPressure'
    commandLine nodeExecutable.get(), '--test', 'tools/performance/check.test.cjs'
}
tasks.register('performanceCheck', Exec) {
    group = 'verification'
    description = 'Runs all 347 pinned closures on JVM/Node/real browsers, long sessions and fixed fail-closed budgets.'
    dependsOn 'fullCorpusEditorWasm', 'editorPressure', 'observationPressure', 'fullCorpusArtifacts', 'performanceCheckerTest'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), 'tools/performance/check.cjs'
}
project(':interlis-cli') {
    tasks.matching { it.name == 'fullCorpusJvm' }.configureEach { dependsOn 'fullCorpus'; mustRunAfter ':checkPortable', ':checkBrowser', ':conformanceCheck', ':sdkProcessCheck', ':sdkPackage', ':legacyCliCheck', ':interlis-wasm-webimage:webImageProbe', ':interlis-wasm-teavm:prepareBrowserHarness' }
    tasks.matching { it.name == 'editorPressure' }.configureEach { mustRunAfter ':fullCorpusEditorWasm' }
    tasks.matching { it.name == 'observationPressure' }.configureEach { mustRunAfter 'editorPressure' }
}


tasks.named('wasmBenchmark') { mustRunAfter 'checkPortable', 'checkBrowser', 'conformanceCheck', ':interlis-wasm-webimage:webImageProbe' }
tasks.named('browserBenchmark') { mustRunAfter 'wasmBenchmark', 'checkPortable', 'checkBrowser', 'conformanceCheck', ':interlis-wasm-webimage:webImageProbe' }


tasks.register('sdkPackage', Zip) {
    group = 'distribution'
    description = 'Builds the reproducible SDK/CLI archive (not published).'
    dependsOn ':interlis-cli:installDist', 'sdkProcessCheck'
    archiveFileName = "interlis-java-sdk-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('releases')
    from(project(':interlis-cli').layout.buildDirectory.dir('install/interlis-cli')) {
        into 'cli'
    }
    from(rootProject.file('examples/sdk')) {
        into 'examples/sdk'
    }
    from(rootProject.file('build/reports/sdk/version-manifest.json')) {
        into 'version'
    }
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}


tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs the explicitly selected release profile (-PreleaseProfile=P3).'
    dependsOn 'releaseCheckP3'
}
tasks.register('sdkReproducibilityCheck', Exec) {
    group = 'verification'
    dependsOn 'checkNodeRuntime'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), 'tools/release/reproducibility.cjs'
}
tasks.register('releaseEvidenceCheckerTest', Exec) {
    group = 'verification'
    dependsOn 'checkNodeRuntime'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), '--test', 'tools/release/evidence.test.cjs', 'tools/verification/node-junit.test.cjs'
}
tasks.register('releaseEvidenceCheck', Exec) {
    group = 'verification'
    description = 'Fails closed on missing, stale, foreign or incomplete P3 candidate evidence.'
    dependsOn 'checkPortable', 'checkBrowser', 'conformanceEvidence', 'performanceCheck',
            'platformCheck', 'sdkArchiveCheck', 'sdkReproducibilityCheck',
            'releaseEvidenceCheckerTest', ':interlis-wasm-webimage:webImageProbe'
    workingDir rootProject.projectDir
    commandLine nodeExecutable.get(), 'tools/release/evidence.cjs'
}
tasks.named('releaseCheckP3') { dependsOn 'releaseEvidenceCheck' }
project(':interlis-cli') {
    tasks.matching { it.name == 'fullCorpusJvm' }.configureEach {
        mustRunAfter ':sdkReproducibilityCheck', ':platformCheck', ':releaseEvidenceCheckerTest', ':conformanceEvidence'
    }
}

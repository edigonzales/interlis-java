plugins { id 'base' }

// Gradle owns only the two backend adapters. Root build/ contains versioned sources.
tasks.named('clean', Delete) { setDelete([]); dependsOn ':interlis-wasm-teavm:clean', ':interlis-wasm-webimage:clean' }
allprojects { group = 'guru.interlis'; version = gradle.ext.jvmSnapshot.data.projectVersion }

def nodeExecutable = providers.gradleProperty('nodeExecutable').orElse('node')
tasks.register('checkNodeRuntime') {
    group = 'verification'
    doLast {
        def actual = providers.exec { commandLine nodeExecutable.get(), '--version' }.standardOutput.asText.get().trim()
        def expected = "v${providers.gradleProperty('nodeVersion').get()}"
        if(actual != expected) throw new GradleException("Node ${expected} required; select -PnodeExecutable=/absolute/node")
    }
}
subprojects { sub ->
    sub.plugins.withId('java') { rootProject.tasks.named('check') { dependsOn "${sub.path}:check" } }
}

plugins {
    id 'java-base'
    id 'maven-publish'
    id 'org.gradlex.java-module-testing' version '1.8.1' apply false
    id 'org.gradlex.extra-java-module-info' version '1.14.2' apply false
}

allprojects {
    group = 'guru.interlis'
    version = '0.2.0-SNAPSHOT'
}

configure(subprojects.findAll { it.file('src/main/java/module-info.java').isFile() }) {
    apply plugin: 'java-library'
    apply plugin: 'org.gradlex.java-module-testing'
    apply from: rootProject.file('gradle/java-conventions.gradle')
    javaModuleTesting.whitebox(testing.suites.test) {
        requires.add('org.junit.jupiter.api')
    }

    if (name in ['interlis-model', 'interlis-compiler', 'interlis-compiler-cli',
                 'interlis-lsp', 'interlis-projection', 'interlis-transfer', 'interlis-xtf']) {
        tasks.named('test') { inputs.dir(rootProject.file('testdata')).withPathSensitivity(PathSensitivity.RELATIVE) }
    }

    testing.suites.test.useJUnitJupiter(libs.versions.junit.get())
}

def nodeExecutable = providers.gradleProperty('nodeExecutable').orElse('node')
tasks.register('checkNodeRuntime') {
    group = 'verification'
    doLast {
        def actual = providers.exec { commandLine nodeExecutable.get(), '--version' }.standardOutput.asText.get().trim()
        def expected = "v${providers.gradleProperty('nodeVersion').get()}"
        if(actual != expected) throw new GradleException("Node ${expected} required; select -PnodeExecutable=/absolute/node")
    }
}
subprojects { sub ->
    sub.plugins.withId('java') { rootProject.tasks.named('check') { dependsOn "${sub.path}:check" } }
}

apply from: 'gradle/distributions.gradle'
apply from: 'gradle/conformance.gradle'

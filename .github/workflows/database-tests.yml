name: Database integration tests
on: push
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Test PostgreSQL and GeoPackage
        run: ./gradlew :interlis-db:dbTest
      - name: Retain database test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-tests
          path: interlis-db/build/test-results/dbTest/

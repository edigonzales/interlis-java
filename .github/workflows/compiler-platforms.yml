name: Compiler platform contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: JVM and distribution (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Verify JVM, CLI and installed SDK processes
        id: jvm
        shell: pwsh
        run: |
          java build/InterlisJvmBuild.java host --profile platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the explicit run, including failed processes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ steps.jvm.outputs.evidence }}
      - name: Retain failed JVM test reports and process logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-test-failures-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/jenesis-jvm/engine/**/executed~/supplement/
            target/jenesis-jvm/engine/**/executed~/output/reports/

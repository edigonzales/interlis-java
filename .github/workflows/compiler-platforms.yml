name: Compiler platform contracts
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-platforms-${{ github.event_name }}-${{ github.ref }}
  queue: max
jobs:
  linux:
    name: JVM and distribution (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Build and check JVM modules and installed packages
        run: ./gradlew check packageTest compilerZipChecksum
      - name: Run upstream swisstopo validator suite
        run: |
          git clone --depth 1 --branch master https://github.com/geostandards-ch/suite-interlis.git "$RUNNER_TEMP/suite-interlis"
          ./gradlew swisstopoConformance "-PswisstopoSuiteDir=$RUNNER_TEMP/suite-interlis"
      - name: Run pinned Codeberg suite
        run: ./gradlew codebergConformance
      - name: Retain native JVM and conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-tests-linux-x64-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            **/build/test-results/
            build/conformance/codeberg/report.json
            build/conformance/codeberg/summary.json
            build/conformance/codeberg/runner.*
            build/conformance/swisstopo/TEST-*.xml
            build/conformance/swisstopo/summary.txt
      - name: Retain the verified compiler ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-bindist-${{ github.sha }}
          path: build/distributions/compiler/
          if-no-files-found: error
          retention-days: 30

      - name: Retain the verified LSP ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lsp-distribution-${{ github.sha }}
          path: interlis-lsp/build/distributions/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: applications-linux-x64
          path: build/distributions/apps/*.zip
          if-no-files-found: error

  portable:
    name: TeaVM and Chromium (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Read the Node pin
        id: node
        run: |
          version=$(sed -n 's/^nodeVersion=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false
      - name: Install locked dependencies and Chromium
        working-directory: interlis-wasm-teavm
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Check generated TeaVM JS, WasmGC and Chromium
        run: |
          ./gradlew "-PnodeExecutable=$(command -v node)" \
            :interlis-wasm-teavm:teavmJsTest :interlis-wasm-teavm:teavmWasmTest \
            :interlis-wasm-teavm:browserClientTest \
            :interlis-wasm-teavm:browserSmoke \
            :interlis-wasm-teavm:validationBrowserSmoke

  windows:
    name: JVM and distribution (windows-x64)
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve pinned source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Check CLI path and repository configuration
        run: .\gradlew.bat :interlis-compiler-cli:test --tests '*CliApplicationTest' --tests '*RepositoryNetworkConfigurationTest'
      - name: Check repository HTTP and filesystem integration
        run: .\gradlew.bat :interlis-repository:test --tests '*FileSourceLoaderTest' --tests '*HttpSourceLoaderTest' --tests '*HttpRedirectFailureTest' --tests '*HttpNetworkPolicyTest' --tests '*HttpIdentityCacheTest'
      - name: Check validator CLI and installed packages
        run: .\gradlew.bat :interlis-validator-cli:test packageTest
      - name: Retain native JVM reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-tests-windows-x64-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: '**/build/test-results/'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: applications-win32-x64
          path: build/distributions/apps/*.zip
          if-no-files-found: error

  macos:
    name: JVM distributions (darwin-arm64)
    # Hosted macOS ARM64 capacity is temporarily unavailable.
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - run: ./gradlew packageTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: applications-darwin-arm64
          path: build/distributions/apps/*.zip
          if-no-files-found: error

  publish:
    name: Publish JVM snapshots
    needs: [linux, portable, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: compiler-snapshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiler-bindist-${{ github.sha }}
          path: publication/compiler
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lsp-distribution-${{ github.sha }}
          path: publication/lsp
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Publish the tested compiler and LSP snapshots
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo "::error::Configure INTERLIS_MAVEN_USERNAME and INTERLIS_MAVEN_TOKEN as GitHub Actions secrets"
            exit 1
          fi
          ./gradlew publishCompilerSnapshotPublicationToCompilerSnapshotsRepository
          node tools/release/verify-snapshot.cjs interlis-compiler-bindist publication/compiler
          ./gradlew publishLspSnapshotPublicationToCompilerSnapshotsRepository
          node tools/release/verify-snapshot.cjs interlis-lsp-distribution publication/lsp

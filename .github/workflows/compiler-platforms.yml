name: Compiler platform contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-platforms-${{ github.event_name }}-${{ github.ref }}
  queue: max
jobs:
  platform:
    name: JVM and distribution (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Verify JVM, CLI and installed SDK processes
        id: jvm
        shell: pwsh
        run: |
          java build/InterlisJvmBuild.java host --profile platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the explicit run, including failed processes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ steps.jvm.outputs.evidence }}
      - name: Retain failed JVM test reports and process logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-test-failures-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/jenesis-jvm/engine/**/executed~/supplement/
            target/jenesis-jvm/engine/**/executed~/output/reports/
      - name: Package and smoke-test the compiler ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.platform == 'linux-x64'
        shell: bash
        env:
          PLATFORM_RUN: ${{ steps.jvm.outputs.evidence }}
        run: |
          set -euo pipefail
          test "$(cat "$PLATFORM_RUN/reports/platform/commit.txt")" = "$GITHUB_SHA"
          java build/InterlisJvmBuild.java compiler-bindist --inputs "$PLATFORM_RUN"
          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          (cd "$PLATFORM_RUN/bindist" && sha256sum --check SHA256SUMS)
          unzip -q "$PLATFORM_RUN"/bindist/*.zip -d "$unpacked"
          launcher="$unpacked/cli/bin/interlis-compiler"
          test -x "$launcher"
          test -f "$launcher.bat"
          "$launcher" version --json | jq -e --slurpfile report "$PLATFORM_RUN/reports/platform/result.json" \
            '.tool == "interlis-compiler" and .version == $report[0].versions.version'
          printf '%s\n' 'INTERLIS 2.3; MODEL Smoke AT "https://example.org" VERSION "1" = END Smoke.' > "$unpacked/Smoke.ili"
          "$launcher" check --offline "$unpacked/Smoke.ili"
      - name: Retain the verified compiler ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-bindist-${{ github.sha }}
          path: ${{ steps.jvm.outputs.evidence }}/bindist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish compiler snapshot
    needs: platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: compiler-snapshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiler-bindist-${{ github.sha }}
          path: publication
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
          server-id: compiler-snapshots
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Upload and verify the compiler snapshot
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo "::error::Configure INTERLIS_MAVEN_USERNAME and INTERLIS_MAVEN_TOKEN as GitHub Actions secrets"
            exit 1
          fi
          node tools/release/publish-compiler-bindist.cjs publication

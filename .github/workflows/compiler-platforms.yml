name: Compiler platform contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-platforms-${{ github.event_name }}-${{ github.ref }}
  queue: max
jobs:
  linux:
    name: JVM and distribution (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Run JVM tests
        run: java build/InterlisJvmBuild.java build
      - name: Check installed SDK, CLI and LSP
        run: java build/InterlisJvmBuild.java sdk-check
      - name: Run pinned Codeberg suite
        run: java build/InterlisJvmBuild.java conformance
      - name: Package and smoke-test the compiler ZIP
        run: java build/InterlisJvmBuild.java compiler-bindist
      - name: Retain native JVM and Codeberg reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-tests-linux-x64-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/jenesis-jvm/engine/**/executed/output/reports/
            target/jenesis-jvm/engine/**/executed~/supplement/
            target/jenesis-jvm/engine/**/executed~/output/reports/
            target/jenesis-jvm/conformance/run-*/report.json
            target/jenesis-jvm/conformance/run-*/summary.json
            target/jenesis-jvm/conformance/run-*/normative-assessment.json
            target/jenesis-jvm/conformance/run-*/runner.*
      - name: Retain the verified compiler ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-bindist-${{ github.sha }}
          path: target/jenesis-jvm/delivery/bindist/
          if-no-files-found: error
          retention-days: 30

  portable:
    name: TeaVM and Chromium (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Read the Node pin
        id: node
        run: |
          version=$(sed -n 's/^nodeVersion=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false
      - name: Install locked dependencies and Chromium
        working-directory: interlis-wasm-teavm
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Export the JVM inputs without running JVM tests
        id: jvm
        run: |
          java build/InterlisJvmBuild.java wasm-export | tee wasm-export.log
          snapshot=$(sed -n 's/^Consumer snapshot: //p' wasm-export.log)
          manifest=${snapshot% SHA-256=*}
          checksum=${snapshot##* SHA-256=}
          test -f "$manifest"
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          printf 'manifest=%s\nchecksum=%s\n' "$manifest" "$checksum" >> "$GITHUB_OUTPUT"
      - name: Check generated TeaVM JS, WasmGC, client and worker
        env:
          JVM_INPUTS: ${{ steps.jvm.outputs.manifest }}
          JVM_INPUTS_SHA256: ${{ steps.jvm.outputs.checksum }}
        run: |
          export INTERLIS_NODE="$(command -v node)"
          java build/InterlisJvmBuild.java wasm --profile teavm-smoke \
            --inputs "$JVM_INPUTS" --inputs-sha256 "$JVM_INPUTS_SHA256"
      - name: Check Chromium with the generated browser package
        env:
          JVM_INPUTS: ${{ steps.jvm.outputs.manifest }}
          JVM_INPUTS_SHA256: ${{ steps.jvm.outputs.checksum }}
        run: |
          export INTERLIS_NODE="$(command -v node)"
          java build/InterlisJvmBuild.java wasm --profile browser-smoke \
            --inputs "$JVM_INPUTS" --inputs-sha256 "$JVM_INPUTS_SHA256"
      - name: Check the shared diagram UI
        working-directory: frontend/diagram-ui
        run: |
          npm ci
          npm test

  windows:
    name: JVM and distribution (windows-x64)
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve pinned source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Check CLI path and repository configuration
        run: java build/InterlisJvmBuild.java build --module interlis-compiler-cli --tests '.*(CliApplicationTest|RepositoryNetworkConfigurationTest)'
      - name: Check repository HTTP and filesystem integration
        run: java build/InterlisJvmBuild.java build --module interlis-repository --tests '.*(FileSourceLoaderTest|HttpSourceLoaderTest|HttpRedirectFailureTest|HttpNetworkPolicyTest|HttpIdentityCacheTest)'
      - name: Check installed SDK, CLI and LSP
        run: java build/InterlisJvmBuild.java sdk-check
      - name: Package and smoke-test the compiler ZIP
        run: java build/InterlisJvmBuild.java compiler-bindist
      - name: Retain native JVM reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-tests-windows-x64-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            target/jenesis-jvm/engine/**/executed/output/reports/
            target/jenesis-jvm/engine/**/executed~/supplement/
            target/jenesis-jvm/engine/**/executed~/output/reports/

  publish:
    name: Publish compiler snapshot
    needs: [linux, portable, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: compiler-snapshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiler-bindist-${{ github.sha }}
          path: publication
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25.0.3'
          server-id: compiler-snapshots
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Upload and verify the compiler snapshot
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo "::error::Configure INTERLIS_MAVEN_USERNAME and INTERLIS_MAVEN_TOKEN as GitHub Actions secrets"
            exit 1
          fi
          node tools/release/publish-compiler-bindist.cjs publication

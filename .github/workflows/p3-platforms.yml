name: P3 platform contracts

on:
  push:
    branches: [codex/p3-compiler-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: JVM and distribution (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            wrapper: ./gradlew
          - platform: windows-x64
            os: windows-2025
            wrapper: ./gradlew.bat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Record actual checkout and runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/reports/p3/platform | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 build/reports/p3/platform/commit.txt
          java -XshowSettings:properties -version 2>&1 | Out-File -Encoding utf8 build/reports/p3/platform/runtime.txt
      - name: Verify JVM, CLI and installed SDK processes
        shell: pwsh
        run: |
          & '${{ matrix.wrapper }}' --no-daemon check legacyCliCheck sdkProcessCheck sdkPackage :interlis-lsp:installDist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual reports, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p3-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/reports/p3/platform/
            build/reports/p3/legacy/
            build/reports/sdk/
            build/releases/
            */build/test-results/
            */build/reports/tests/

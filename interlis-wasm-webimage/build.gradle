plugins { id 'java-library' }
apply from: rootProject.file('gradle/java-conventions.gradle')
apply from: rootProject.file('gradle/backend-inputs.gradle')

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

def graalHome = providers.gradleProperty('graalVmHome')
        .orElse(providers.environmentVariable('GRAALVM_HOME'))
        .orElse('')
def binaryenHome = providers.gradleProperty('binaryenHome')
        .orElse(providers.environmentVariable('BINARYEN_HOME'))
        .orElse('')
def nodeExecutable = providers.gradleProperty('nodeExecutable').orElse('node')

tasks.register('compileWebImageProbe', JavaCompile) {
    group = 'verification'
    description = 'Compiles the Web Image bootstrap against the external GraalVM jmods.'
    source = fileTree('src/webImage/java')
    classpath = configurations.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/webImage')
    options.release = 25
    options.encoding = 'UTF-8'
    doFirst {
        if (!graalHome.get()) {
            throw new GradleException('webImageProbe requires -PgraalVmHome or GRAALVM_HOME')
        }
        options.compilerArgs += ['--module-path', "${graalHome.get()}/jmods",
                                 '--add-modules', 'org.graalvm.webimage.api']
    }
    dependsOn configurations.runtimeClasspath
}

tasks.register('webImageBuild', Exec) {
    group = 'verification'
    description = 'Builds the same compiler bridge with the GraalVM Web Image backend.'
    dependsOn 'compileWebImageProbe'
    doFirst {
        if (!graalHome.get()) {
            throw new GradleException('webImageProbe requires -PgraalVmHome or GRAALVM_HOME')
        }
        if (!binaryenHome.get()) {
            throw new GradleException('webImageProbe requires -PbinaryenHome or BINARYEN_HOME')
        }
        def out = layout.buildDirectory.dir('webimage').get().asFile
        out.mkdirs()
        def cp = configurations.runtimeClasspath.asPath + File.pathSeparator +
                layout.buildDirectory.dir('classes/webImage').get().asFile.absolutePath
        environment 'PATH', "${binaryenHome.get()}/bin:" + System.getenv('PATH')
        commandLine "${graalHome.get()}/bin/native-image", '--tool:svm-wasm',
                '--no-fallback', '-cp', cp,
                'guru.interlis.wasm.webimage.WebImageEntryPoint',
                '-o', new File(out, 'interlis-compiler').absolutePath
    }
}

tasks.register('webImageSmoke', Exec) {
    group = 'verification'
    dependsOn ':checkNodeRuntime', 'webImageBuild'
    timeout = java.time.Duration.ofSeconds(60)
    workingDir = projectDir
    environment 'INTERLIS_PRODUCT_VERSION', gradle.ext.jvmSnapshot.data.projectVersion
    commandLine nodeExecutable.get(), '--test', 'test/webimage.test.cjs'
}

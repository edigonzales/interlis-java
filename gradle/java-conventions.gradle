group = 'guru.interlis'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-serial,-processing']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'testdata.dir', rootProject.file('testdata').absolutePath
    systemProperty 'repo.root', rootProject.projectDir.absolutePath
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    // Internal packages are implementation details, not published API.
    exclude '**/internal/**'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('compileJava') {
    if (file('src/main/java/module-info.java').isFile()) {
        options.javaModuleVersion = providers.provider { project.version.toString() }
    }
}

// Read-only checks of the existing G2 evidence, deliberately separate from normal CLI tests.
import groovy.json.JsonSlurper
import java.security.MessageDigest

def matrixFile = rootProject.file('docs/evidence/stabilization/g2-rule-matrix.json')
def matrix = new JsonSlurper().parse(matrixFile)
def sha = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }

tasks.register('prepareNormativeInputs') {
    group = 'verification'
    description = 'Verifies the two original, pinned INTERLIS PDFs used by G2 quotations.'
    doLast {
        def configured = System.getenv('INTERLIS_NORM_CACHE')
        def cache = configured ? rootProject.file(configured) : new File(System.getProperty('user.home'), '.cache/interlis-java/norms')
        cache.mkdirs()
        matrix.documents.each { version, document ->
            def name = "ili${version.replace('.', '')}.pdf"
            def cached = new File(cache, name)
            if (!cached.exists()) {
                def temporary = File.createTempFile(name, '.download', cache)
                try {
                    def connection = new URI(document.url as String).toURL().openConnection()
                    connection.connectTimeout = 180000
                    connection.readTimeout = 180000
                    connection.inputStream.withCloseable { input -> temporary.withOutputStream { it << input } }
                    if (sha(temporary) != document.sha256) throw new GradleException("Changed norm PDF: $version")
                    java.nio.file.Files.move(temporary.toPath(), cached.toPath())
                } finally { temporary.delete() }
            }
            if (sha(cached) != document.sha256) throw new GradleException("Changed norm PDF: $version ($cached)")
            def target = rootProject.file("build/norms/$name")
            target.parentFile.mkdirs()
            java.nio.file.Files.copy(cached.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}


// One selected producer per product module, using its ordinary test source set.
def original = new JsonSlurper().parse(rootProject.file('testdata/g2/completion-links.json'))
def overlay = new JsonSlurper().parse(rootProject.file('testdata/verification/current-bindings.json'))
def bindings = original.bindings + overlay.overrides + overlay.extras
rootProject.ext.contractRunId = UUID.randomUUID().toString()
def selected = bindings.values().groupBy { it.source.tokenize('/')[0] }
selected.each { module, rows ->
    project(":" + module) {
        plugins.withId('java') {
            tasks.register('contractAssertionsTest', Test) {
                group = 'verification'
                testClassesDirs = sourceSets.test.output.classesDirs
                classpath = sourceSets.test.runtimeClasspath
                def links = rows.collect { it.suite + '.' + it.method }.unique().sort()
                if (links.empty) throw new GradleException('Empty contract assertion selection')
                filter { links.each { includeTestsMatching(it) }; failOnNoMatchingTests = true }
                reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/contractAssertionsTest')
                reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/contractAssertionsTest')
                systemProperty 'repo.root', rootProject.projectDir.absolutePath
                outputs.upToDateWhen { false }
                outputs.cacheIf { false }
                def manifest = layout.buildDirectory.file('contract-assertions.json')
                outputs.file(manifest)
                def started = [value: null]
                doFirst {
                    delete reports.junitXml.outputLocation, manifest
                    started.value = java.time.Instant.now().truncatedTo(java.time.temporal.ChronoUnit.SECONDS).toString()
                }
                doLast {
                    def xmls = reports.junitXml.outputLocation.get().asFile.listFiles().findAll { it.name.endsWith('.xml') }.sort { it.name }
                    if (xmls.empty) throw new GradleException('No current assertion reports')
                    def git = { String arg -> providers.exec { workingDir rootProject.projectDir; commandLine 'git', 'rev-parse', arg }.standardOutput.asText.get().trim() }
                    manifest.get().asFile.text = groovy.json.JsonOutput.toJson([
                        runId: rootProject.ext.contractRunId, started: started.value,
                        gitCommit: git('HEAD'), treeSha: git('HEAD^{tree}'),
                        hashes: xmls.collectEntries { [(it.name): sha(it)] }])
                }
            }
        }
    }
}
project(':interlis-verification') {
    plugins.withId('java') {
        tasks.named('test', Test) {
            // Unit counterprobes read current source bindings too: data-only or
            // comment-only edits must not reuse an unrelated successful report.
            inputs.files(bindings.values().collect { rootProject.file(it.source) })
            inputs.files(original.requirements.collectMany { it.processEvidence ?: [] }.collect {
                rootProject.file(overlay.processOverrides[it.source]?.source ?: it.source)
            })
        }
        tasks.register('contractTest', Test) {
            group = 'verification'
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform { includeTags 'compiler-contract' }
            systemProperty 'repo.root', rootProject.projectDir.absolutePath
            systemProperty 'contract.runId', rootProject.ext.contractRunId
            dependsOn ':prepareNormativeInputs'
            selected.keySet().each { dependsOn ":" + it + ':contractAssertionsTest' }
            reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/contractTest')
            reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/contractTest')
            outputs.upToDateWhen { false }
            outputs.cacheIf { false }
            afterSuite { descriptor, result ->
                if (!descriptor.parent && result.testCount == 0) throw new GradleException('No compiler-contract tests discovered')
            }
        }
    }
}
tasks.register('compilerContractCheck') {
    group = 'verification'
    description = 'Current selected compiler coverage, execution and normative decision contracts.'
    dependsOn ':interlis-verification:contractTest'
}

// Jenesis owns the products and the resolved JVM closure. Gradle tracks the JARs as classpath inputs.
ext.jenesisJava = new File(System.getProperty('java.home'), 'bin/java' +
        (System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''))

ext.jenesisRuntime = { String module ->
    def root = rootDir.toPath().toRealPath()
    def engine = root.resolve('target/jenesis-jvm/engine')
    for (def path = engine; path != root; path = path.parent) {
        if (java.nio.file.Files.isSymbolicLink(path)) {
            throw new GradleException("Symlink in Jenesis output path: ${path}")
        }
    }
    def invocation = providers.exec {
        workingDir rootDir
        commandLine jenesisJava, "-Djenesis.make.root=${rootDir}",
                '-Djenesis.project.target=target/jenesis-jvm/engine', '-Djenesis.test.skip=true',
                'build/jenesis/Make.java',
                "+${module}/inventory"
        ignoreExitValue = true
    }
    invocation.result.map { result ->
        if (result.exitValue != 0) {
            throw new GradleException("Jenesis failed for ${module}\n" +
                    invocation.standardError.asText.get() + invocation.standardOutput.asText.get())
        }
        def inventory = engine.resolve("build/maven/compose/module/build-module-${module}/inventory/output").toRealPath()
        if (!inventory.startsWith(engine)) throw new GradleException("Foreign Jenesis inventory: ${inventory}")
        def data = new Properties()
        inventory.resolve('inventory.properties').toFile().withReader('UTF-8') { data.load(it) }
        def prefix = "module-${module}"
        if (data.getProperty("${prefix}.artifact") != module) {
            throw new GradleException("Unexpected Jenesis inventory for ${module}")
        }
        def jars = []
        for (int index = 0; data.containsKey("${prefix}.runtime.${index}".toString()); index++) {
            def jar = inventory.resolve(data.getProperty("${prefix}.runtime.${index}")).toRealPath()
            if (!jar.startsWith(engine) || !jar.toFile().isFile()) {
                throw new GradleException("Foreign JVM classpath entry: ${jar}")
            }
            jars.add(jar.toFile())
        }
        if (jars.isEmpty()) throw new GradleException("Missing Jenesis runtime closure for ${module}")
        jars
    }
}

ext.bridgeRuntime = jenesisRuntime('interlis-wasm-bridge')

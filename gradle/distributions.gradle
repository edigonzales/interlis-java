evaluationDependsOn(':interlis-compiler-cli')
evaluationDependsOn(':interlis-lsp')

def compiler = project(':interlis-compiler-cli')
def compilerInstall = compiler.tasks.named('installDist', Sync)
def compilerVersion = compiler.tasks.named('writeVersionManifest')
def lsp = project(':interlis-lsp')

tasks.register('compilerZip', Zip) {
    archiveBaseName = 'interlis-compiler-bindist'
    destinationDirectory = layout.buildDirectory.dir('distributions/compiler')
    into('cli') { from compilerInstall }
    filesMatching('**/bin/interlis-compiler') { permissions { unix('rwxr-xr-x') } }
    from 'LICENSE'
    from 'packaging/compiler'
}

tasks.register('sdkZip', Zip) {
    archiveFileName = 'sdk.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions/sdk')
    into('cli') { from compilerInstall }
    filesMatching('**/bin/interlis-compiler') { permissions { unix('rwxr-xr-x') } }
    into('examples/sdk') { from 'examples/sdk' }
    into('version') { from compilerVersion }
}

def sha256 = { byte[] bytes ->
    java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(bytes))
}

evaluationDependsOn(':interlis-validator-cli')
def validator = project(':interlis-validator-cli')
def validatorInstall = validator.tasks.named('installDist', Sync)
def lspZip = lsp.tasks.named('distZip', Zip)
def compilerZip = tasks.named('compilerZip', Zip)
def sdkZip = tasks.named('sdkZip', Zip)

def os = System.getProperty('os.name')
def arch = System.getProperty('os.arch')
def hostTarget = os.startsWith('Windows') && arch == 'amd64' ? 'win32-x64' :
        os.startsWith('Linux') && arch == 'amd64' ? 'linux-x64' :
        os.startsWith('Mac') && arch == 'aarch64' ? 'darwin-arm64' : null
def jdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }

[compiler: compilerInstall, validator: validatorInstall].each { product, install ->
    def appName = "interlis-${product}"
    def modules = ['java.net.http', 'java.xml', 'jdk.charsets', 'jdk.crypto.ec']
    // MVStore uses SQL classes through its automatic module.
    if (product == 'validator') modules.add('java.sql')
    def runtime = layout.buildDirectory.dir("runtime/${appName}")
    def image = tasks.register("${product}Runtime", Exec) {
        group = 'distribution'
        inputs.files jdk.map { launcher ->
            def home = launcher.metadata.installationPath
            [home.dir('jmods'), home.file('lib/modules'), home.dir('legal')]
        }
        inputs.property 'modules', modules
        outputs.dir runtime
        doFirst {
            if (hostTarget == null) throw new GradleException("Unsupported application platform: ${os} ${arch}")
            delete runtime
            runtime.get().asFile.parentFile.mkdirs()
            def home = jdk.get().metadata.installationPath
            commandLine home.file(os.startsWith('Windows') ? 'bin/jlink.exe' : 'bin/jlink').asFile,
                    '--add-modules', modules.join(','),
                    '--no-header-files', '--no-man-pages', '--output', runtime.get().asFile
        }
    }
    tasks.register("${product}AppZip", Zip) {
        group = 'distribution'
        archiveBaseName = appName
        archiveClassifier = hostTarget ?: 'unsupported'
        destinationDirectory = layout.buildDirectory.dir('distributions/apps')
        into(appName) {
            from(install) {
                filesMatching("bin/${appName}") {
                    filter { line -> line == 'if [ -n "$JAVA_HOME" ] ; then' ?
                        'JAVA_HOME=$APP_HOME/runtime\n' + line : line }
                    permissions { unix('rwxr-xr-x') }
                }
                filesMatching("bin/${appName}.bat") {
                    filter { line -> line.startsWith('if defined JAVA_HOME ') ?
                        'set "JAVA_HOME=%~dp0..\\runtime"\r\n' + line : line }
                }
            }
            into('runtime') {
                from image
                filesMatching(['bin/*', 'lib/jspawnhelper']) { permissions { unix('rwxr-xr-x') } }
            }
        }
    }
}

def compilerAppZip = tasks.named('compilerAppZip', Zip)
def validatorAppZip = tasks.named('validatorAppZip', Zip)

sourceSets { packageTest }
configurations {
    sdkExampleRuntime {
        canBeConsumed = false
        attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
    }
}
dependencies {
    sdkExampleRuntime project(':interlis-projection')
    sdkExampleRuntime project(':interlis-xtf')
    sdkExampleRuntime project(':interlis-validation')
    packageTestImplementation platform(libs.junit.bom)
    packageTestImplementation libs.junit.jupiter
    packageTestImplementation 'com.google.code.gson:gson:2.14.0'
    packageTestRuntimeOnly libs.junit.platform.launcher
}
tasks.named('compilePackageTestJava') { options.release = 25 }
tasks.register('packageTest', Test) {
    group = 'verification'
    description = 'Runs the installed compiler, SDK, validator and LSP process checks.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.packageTest.output.classesDirs
    classpath = sourceSets.packageTest.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    inputs.files compilerZip, sdkZip, compilerAppZip, validatorAppZip, compilerInstall, lspZip, configurations.sdkExampleRuntime,
            file('tools/verification/lsp-lifecycle.cjs')
    inputs.dir file('testdata/models')
    inputs.dir file('examples/sdk')
    systemProperty 'repo.root', projectDir.absolutePath
    systemProperty 'product.version', project.version
    systemProperty 'node.executable', providers.gradleProperty('nodeExecutable')
            .orElse(providers.environmentVariable('INTERLIS_NODE')).orElse('node').get()
    doFirst {
        systemProperty 'compiler.zip', compilerZip.get().archiveFile.get().asFile.absolutePath
        systemProperty 'sdk.zip', sdkZip.get().archiveFile.get().asFile.absolutePath
        systemProperty 'compiler.app.zip', compilerAppZip.get().archiveFile.get().asFile.absolutePath
        systemProperty 'validator.zip', validatorAppZip.get().archiveFile.get().asFile.absolutePath
        systemProperty 'lsp.zip', lspZip.get().archiveFile.get().asFile.absolutePath
        systemProperty 'compiler.install', compilerInstall.get().destinationDir.absolutePath
        systemProperty 'sdk.example.modulepath', configurations.sdkExampleRuntime.asPath
    }
}

def checksum = tasks.register('compilerZipChecksum') {
    def archive = compilerZip.flatMap { it.archiveFile }
    def sums = layout.buildDirectory.file('distributions/compiler/SHA256SUMS')
    inputs.file archive
    outputs.file sums
    doLast {
        def zip = archive.get().asFile
        sums.get().asFile.setText(sha256(zip.bytes) + '  ' + zip.name + '\n', 'US-ASCII')
    }
}

def checkedZip = layout.projectDirectory.file("publication/compiler/interlis-compiler-bindist-${version}.zip")
def lspTestRepository = providers.gradleProperty('lspTestRepository')
def checkedLspZip = file("publication/lsp/interlis-lsp-distribution-${version}.zip")

publishing {
    publications {
        lspSnapshot(MavenPublication) {
            artifactId = 'interlis-lsp-distribution'
            if (lspTestRepository.isPresent()) artifact lspZip
            else artifact checkedLspZip
            pom.packaging = 'zip'
        }
        if (!lspTestRepository.isPresent()) {
            compilerSnapshot(MavenPublication) {
                artifactId = 'interlis-compiler-bindist'
                artifact checkedZip.asFile
                pom.packaging = 'zip'
            }
        }
    }
    repositories {
        if (lspTestRepository.isPresent()) {
            maven {
                name = 'lspTest'
                url = file(lspTestRepository.get()).toURI()
            }
        } else {
            maven {
                name = 'compilerSnapshots'
                url = uri('https://jars.interlis.guru/snapshots/')
                credentials {
                    username = providers.environmentVariable('MAVEN_USERNAME').orNull
                    password = providers.environmentVariable('MAVEN_PASSWORD').orNull
                }
            }
        }
    }
}

if (!lspTestRepository.isPresent()) {
    ['CompilerSnapshot', 'LspSnapshot'].each { snapshot ->
        tasks.named("publish${snapshot}PublicationToCompilerSnapshotsRepository") {
            doFirst {
                if (providers.environmentVariable('GITHUB_EVENT_NAME').orNull != 'push' ||
                        providers.environmentVariable('GITHUB_REF').orNull != 'refs/heads/main' ||
                        !project.version.endsWith('-SNAPSHOT')) {
                    throw new GradleException('Snapshot publication requires the main push workflow')
                }
                if (snapshot == 'CompilerSnapshot') {
                    def zip = checkedZip.asFile
                    def sums = new File(zip.parentFile, 'SHA256SUMS')
                    if (sums.getText('US-ASCII').trim() != sha256(zip.bytes) + '  ' + zip.name) {
                        throw new GradleException('Compiler snapshot differs from the verified workflow ZIP')
                    }
                }
            }
        }
    }
}

tasks.named('packageTest') {
    useJUnitPlatform { excludeTags 'gui-image', 'gui-shell', 'gui-app' }
}
evaluationDependsOn(':interlis-compiler-gui')
def gui = project(':interlis-compiler-gui')
def guiRuntime = gui.tasks.named('guiRuntime')
def guiApp = gui.tasks.named('guiApp')
def guiInstall = gui.tasks.named('installDist', Sync)
def windowProbe = tasks.register('compileMacGuiWindowProbe', Exec) {
    def source = file('src/packageTest/native/quit-macos-gui.swift')
    def executable = layout.buildDirectory.file('gui-probes/quit-macos-gui')
    inputs.file source
    outputs.file executable
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        executable.get().asFile.parentFile.mkdirs()
        commandLine '/usr/bin/swiftc', source, '-o', executable.get().asFile
    }
}
['guiImageTest': 'gui-image', 'guiShellTest': 'gui-shell', 'guiAppTest': 'gui-app'].each { name, tag ->
    tasks.register(name, Test) {
        group = 'verification'
        useJUnitPlatform { includeTags tag }
        testClassesDirs = sourceSets.packageTest.output.classesDirs
        classpath = sourceSets.packageTest.runtimeClasspath
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        inputs.files guiRuntime, guiInstall
        if (tag != 'gui-image') dependsOn gui.tasks.named('testClasses')
        if (tag == 'gui-app') inputs.files guiApp, windowProbe
        if (tag != 'gui-image') outputs.upToDateWhen { false }
        systemProperty 'repo.root', projectDir.absolutePath
        doFirst {
            systemProperty 'gui.runtime', guiRuntime.get().outputs.files.singleFile.absolutePath
            systemProperty 'gui.libs', new File(guiInstall.get().destinationDir, 'lib').absolutePath
            systemProperty 'gui.test.classes', gui.sourceSets.test.output.classesDirs.asPath
            if (tag == 'gui-app') {
                systemProperty 'gui.app', guiApp.get().outputs.files.singleFile.absolutePath
                systemProperty 'gui.window.probe', windowProbe.get().outputs.files.singleFile.absolutePath
            }
        }
    }
}

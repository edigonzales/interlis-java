// Backend adapter sources only. Shared Java products are immutable Maven inputs.
def handoff = gradle.ext.jvmSnapshot
def consumer = project.name == 'interlis-wasm-teavm' ? 'teavm' : 'webimage'
def verifyOutputBoundary = {
    def boundary=rootProject.projectDir.toPath().toAbsolutePath().normalize()
    def output=layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
    if (!output.startsWith(boundary)) throw new GradleException('Backend output escapes repository')
    for (def parent=output;parent!=boundary;parent=parent.parent)
        if (java.nio.file.Files.isSymbolicLink(parent)) throw new GradleException('Symlink in backend output root')
    if (java.nio.file.Files.exists(output)) java.nio.file.Files.walk(output).withCloseable { paths ->
        paths.forEach { file -> if (java.nio.file.Files.isSymbolicLink(file)) throw new GradleException('Symlink in backend outputs') }
    }
}
verifyOutputBoundary()
def bridge = handoff.data.artifacts.find { it.projectId == 'interlis-wasm-bridge' }
if (!bridge) throw new GradleException('Missing bridge producer in JVM snapshot')
dependencies { implementation bridge.coordinate.substring('maven/'.length()).replace('/', ':') }
java { modularity.inferModulePath = false }
def verifyConsumer = tasks.register('verifyJvmConsumerInputs') {
    group = 'verification'
    description = 'Verifies the resolved immutable JVM closure, including when code generation is up-to-date.'
    doLast { gradle.ext.verifyJvmClasspath(configurations.runtimeClasspath,consumer) }
}
tasks.configureEach {
    inputs.file handoff.manifest
    inputs.property 'jvmInputsSha256', handoff.sha256
    doFirst { verifyOutputBoundary(); gradle.ext.verifyJvmInputs() }
    doLast { verifyOutputBoundary(); gradle.ext.verifyJvmInputs() }
}
configurations.configureEach {
    // Only immutable private SNAPSHOT coordinates are changing. Tool caches retain their normal policy.
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}
tasks.withType(JavaCompile).configureEach {
    dependsOn verifyConsumer
    inputs.file handoff.manifest
    inputs.property 'jvmInputsSha256', handoff.sha256
    doFirst { gradle.ext.verifyJvmClasspath(configurations.runtimeClasspath,consumer) }
    doLast { gradle.ext.verifyJvmInputs() }
}
tasks.matching { it.name in ['generateJavaScript','generateWasmGC','buildWasmGC','webImageBuild'] }.configureEach {
    dependsOn verifyConsumer
    inputs.file handoff.manifest
    inputs.property 'jvmInputsSha256', handoff.sha256
    doFirst { gradle.ext.verifyJvmClasspath(configurations.runtimeClasspath,consumer) }
    doLast { task ->
        def resolved=gradle.ext.verifyJvmClasspath(configurations.runtimeClasspath,consumer)
        def paths = task.name == 'generateJavaScript' ? ['generated/teavm/js/interlis-compiler.js'] :
                task.name == 'generateWasmGC' ? ['generated/teavm/wasm-gc/interlis-compiler.wasm'] :
                task.name == 'buildWasmGC' ? ['generated/teavm/wasm-gc/interlis-compiler.wasm','generated/teavm/wasm-gc/interlis-compiler.wasm-runtime.js'] :
                ['webimage/interlis-compiler.js','webimage/interlis-compiler.js.wasm']
        def generated=[:]
        paths.each { relative ->
            def file=layout.buildDirectory.file(relative).get().asFile
            if (!file.isFile()) throw new GradleException('Missing actual backend output: '+relative)
            generated[relative]=[sha256:HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes)),bytes:file.length()]
        }
        def receipt=layout.buildDirectory.file("consumer-inputs/${task.name}.json").get().asFile
        receipt.parentFile.mkdirs()
        receipt.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                schemaVersion:1,backend:consumer,snapshotDigest:handoff.data.snapshotDigest,
                manifestSha256:handoff.sha256,classpath:resolved,outputs:generated]))+'\n'
    }
}

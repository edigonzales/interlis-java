<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>interlis-java portable compiler</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 70rem; }
    textarea { width: 100%; height: 18rem; font-family: ui-monospace, monospace; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; max-height: 24rem; }
    button { margin-right: .5rem; }
    [data-stale="true"] { opacity:.45; pointer-events:none; }
    .selected rect { stroke:#c40; stroke-width:3; }
  </style>
</head>
<body>
  <h1>interlis-java portable compiler</h1>
  <p>TeaVM WasmGC in a worker. No server-side compiler is used.</p>
  <p><label>Sources <select id="sources"></select></label> <input id="source-name" placeholder="memory:/additional.ili"><button id="add-source">Add source</button><button id="remove-source">Remove source</button></p>
  <textarea id="source">!! Grüezi 😀
INTERLIS 2.4;
MODEL Browser AT "https://example.interlis.ch" VERSION "1.0" =
  DOMAIN Big = 9007199254740993.0010..9007199254740993.0010;
  TOPIC Data =
    CLASS Item =
      height : 0..999;
      exact : Big;
    END Item;
  END Data;
END Browser.
</textarea>
  <p>
    <button id="analyze">Analyze</button>
    <button id="compile">Compile</button>
    <button id="diagram">Diagram</button>
  </p>
  <details><summary>Workspace configuration</summary><textarea id="configuration-text">{}</textarea><button id="configuration">Apply configuration</button></details>
  <p><button id="cancel">Cancel</button><button id="restart">Restart worker</button></p>
  <p><label>Focus <select id="diagram-focus"><option value="">All root models</option></select></label>
    <label>Scope <select id="diagram-scope"><option>SELECTED</option><option>WITH_DEPENDENCIES</option><option>NEIGHBOURHOOD</option></select></label>
    <label>Depth <input id="diagram-depth" type="number" min="0" max="32" value="1"></label>
    <label>Labels <select id="diagram-language"><option value="">Canonical</option></select></label></p>
  <pre id="output" aria-live="polite"></pre><div id="diagram-view" style="overflow:auto;max-height:36rem"></div><div id="members"></div>
  <script type="importmap">{"imports":{"libavoid-js":"./vendor/libavoid/index.js"}}</script>
  <script src="stabilization-contract.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>

plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}
apply from: rootProject.file('gradle/java-conventions.gradle')
apply from: rootProject.file('gradle/backend-inputs.gradle')

def nodeExecutable = providers.gradleProperty('nodeExecutable').orElse('node')

dependencies {
    implementation teavm.libs.jso
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.matching { it.name in ['generateWasmGC', 'generateJavaScript'] }.configureEach {
    outOfProcess = true
    def pinFile = rootProject.file('gradle/teavm-core.json')
    inputs.file pinFile
    def provenance = layout.buildDirectory.file("tooling/teavm/${name}.json")
    outputs.file provenance
    doFirst {
        def pin = new groovy.json.JsonSlurper().parse(pinFile)
        def cores = daemonClasspath.files.findAll { it.name.startsWith('teavm-core-') }
        if (cores.size() != 1 || cores.first().name != 'teavm-core-0.16.0.jar'
                || java.security.MessageDigest.getInstance('SHA-256').digest(cores.first().bytes).encodeHex().toString() != pin.sha256
                || pin.coordinate != 'org.teavm:teavm-core:0.16.0') {
            throw new GradleException('Compiler classpath does not contain the pinned upstream TeaVM core')
        }
        logger.lifecycle("Upstream TeaVM compiler core: ${cores.first()} SHA-256=${pin.sha256}")
    }
    doLast {
        def pin = new groovy.json.JsonSlurper().parse(pinFile)
        def generated = name == 'generateJavaScript' ? file('build/generated/teavm/js/interlis-compiler.js') : file('build/generated/teavm/wasm-gc/interlis-compiler.wasm')
        def artifactSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(generated.bytes).encodeHex().toString()
        provenance.get().asFile.with {
            parentFile.mkdirs()
            setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([core: pin, artifactSha256: artifactSha256])) + '\n', 'UTF-8')
        }
    }
}

teavm {
    all {
        mainClass = 'guru.interlis.wasm.teavm.TeaVmEntryPoint'
    }
    wasmGC {
        targetFileName = 'interlis-compiler.wasm'
        copyRuntime = true
        modularRuntime = false
    }
    js {
        targetFileName = 'interlis-compiler.js'
    }
}

tasks.register('wasmContractTest') {
    group = 'verification'
    timeout = java.time.Duration.ofSeconds(60)
    description = 'Runs the built TeaVM WasmGC module under the configured Node runtime.'
    dependsOn 'buildWasmGC'
    doLast {
        delete file('build/wasm-contract-result.json')
        providers.exec {
            workingDir = projectDir
            commandLine nodeExecutable.get(), '--experimental-wasm-exnref', 'wasm-contract.cjs'
        }.result.get()
        def report = file('build/wasm-contract-result.json')
        if (!report.exists()) {
            throw new GradleException('Wasm contract did not produce a result manifest')
        }
        def result = new groovy.json.JsonSlurper().parse(report)
        if (result.status != 'passed') {
            throw new GradleException('Wasm contract failed: ' + result)
        }
    }
}

def portableContractsBundle = layout.buildDirectory.file('portable-contracts/portable-contracts.js')
tasks.register('bundlePortableContracts', Exec) {
    group = 'verification'
    workingDir = projectDir
    inputs.dir 'contracts'
    inputs.files 'bundle-contracts.cjs', 'package-lock.json'
    outputs.file portableContractsBundle
    commandLine nodeExecutable.get(), 'bundle-contracts.cjs', portableContractsBundle.get().asFile
}

tasks.register('prepareBrowserHarness', Sync) {
    group = 'verification'
    description = 'Copies the browser harness, WasmGC module and runtime into build/web.'
    dependsOn 'buildWasmGC', 'buildBrowserTools', 'bundlePortableContracts'
    from 'src/main/web'
    from(rootProject.file('tools/performance/full-corpus-contract.js'))
    from(layout.buildDirectory.dir('browser-tools'))
    from('token-classification-contract.cjs') {
        rename { 'token-classification-contract.js' }
    }
    from(portableContractsBundle)
    from(layout.buildDirectory.dir('generated/teavm/wasm-gc')) {
        include 'interlis-compiler.wasm'
        include 'interlis-compiler.wasm-runtime.js'
    }
    into layout.buildDirectory.dir('web')
    inputs.file(rootProject.file('tools/release/browser-manifest.cjs'))
    inputs.property('candidate', providers.exec {
        workingDir rootProject.projectDir
        commandLine nodeExecutable.get(), '-e', "const p=require('./tools/verification/source-fingerprint.cjs');process.stdout.write(JSON.stringify({fingerprint:p.fingerprint(),...p.commitInfo()}));"
    }.standardOutput.asText)
    doLast {
        providers.exec {
            workingDir rootProject.projectDir
            commandLine nodeExecutable.get(), rootProject.file('tools/release/browser-manifest.cjs'), layout.buildDirectory.dir('web').get().asFile,
                    new File(gradle.ext.jvmSnapshot.root,'resources/version-manifest.json')
        }.result.get().assertNormalExitValue()
    }
}

tasks.register('jsContractTest') {
    group = 'verification'
    timeout = java.time.Duration.ofSeconds(60)
    description = 'Runs the TeaVM JavaScript backend under the configured Node runtime.'
    dependsOn 'generateJavaScript'
    doLast {
        delete file('build/js-contract-result.json')
        providers.exec {
            workingDir = projectDir
            commandLine nodeExecutable.get(), 'js-contract.cjs'
        }.result.get()
        def report = file('build/js-contract-result.json')
        if (!report.exists()) {
            throw new GradleException('JavaScript contract did not produce a result manifest')
        }
        def result = new groovy.json.JsonSlurper().parse(report)
        if (result.status != 'passed') {
            throw new GradleException('JavaScript contract failed: ' + result)
        }
    }
}

tasks.register('diagramAdapterTest', Exec) {
    group = 'verification'
    description = 'Tests the TypeScript-contract diagram adapter without a browser.'
    dependsOn 'browserClientTest'
    workingDir = projectDir
    commandLine nodeExecutable.get(), rootProject.file('tools/verification/node-contract.cjs'), 'diagram'
}

tasks.register('browserContractTest', Exec) {
    group = 'verification'
    description = 'Runs the browser matrix through Playwright (Chromium, Firefox, WebKit).'
    dependsOn 'prepareBrowserHarness', 'diagramAdapterTest'
    workingDir = projectDir
    commandLine nodeExecutable.get(), 'browser-contract.cjs'
}

tasks.register('safariContractTest', Exec) {
    group = 'verification'
    description = 'Attempts a real Safari WebDriver contract; fails visibly when remote automation is unavailable.'
    dependsOn 'prepareBrowserHarness'
    workingDir = projectDir
    commandLine nodeExecutable.get(), 'safari-contract.cjs'
}

tasks.named('prepareBrowserHarness') {
    from(rootProject.file('testdata/reference/unicode/17.0.0/UNICODE-LICENSE.txt'))
}

// The existing Node builder prepares the neutral renderer directly.
tasks.register('buildBrowserTools', Exec) {
    group = 'build'
    description = 'Strictly checks the pinned TypeScript client and builds ESM/declarations.'
    workingDir = projectDir
    commandLine nodeExecutable.get(), 'build-browser-tools.cjs'
}
tasks.register('browserClientTest', Exec) {
    group = 'verification'
    description = 'Exercises the bounded worker host and client against the real TeaVM JS compiler.'
    dependsOn 'buildBrowserTools', 'generateJavaScript'
    workingDir = projectDir
    commandLine nodeExecutable.get(), rootProject.file('tools/verification/node-contract.cjs'), 'client'
}

tasks.register('uiProjectionTest', Exec) {
    group = 'verification'
    description = 'Checks real browser UI language/focus/depth and rejects a delayed actual layout.'
    dependsOn 'prepareBrowserHarness'
    workingDir = projectDir
    commandLine nodeExecutable.get(), '--test', 'ui-projection.test.cjs'
}

// Narrow portability check for revision-bound missing-import causes; no corpus or benchmark run.
tasks.register('repositoryDiagnosticCheck', Exec) {
    timeout = java.time.Duration.ofSeconds(60)
    group = 'verification'
    dependsOn ':checkNodeRuntime', 'generateJavaScript', 'buildWasmGC'
    workingDir projectDir
    commandLine nodeExecutable.get(), '--experimental-wasm-exnref', 'repository-diagnostic-contract.cjs'
}

plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}
apply from: rootProject.file('gradle/java-conventions.gradle')
apply from: rootProject.file('gradle/backend-inputs.gradle')

def nodeExecutable = providers.gradleProperty('nodeExecutable').orElse('node')

dependencies {
    implementation teavm.libs.jso
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.matching { it.name in ['generateWasmGC', 'generateJavaScript'] }.configureEach {
    outOfProcess = true
    def pinFile = rootProject.file('gradle/teavm-core.json')
    inputs.file pinFile
    def provenance = layout.buildDirectory.file("tooling/teavm/${name}.json")
    outputs.file provenance
    doFirst {
        def pin = new groovy.json.JsonSlurper().parse(pinFile)
        def cores = daemonClasspath.files.findAll { it.name.startsWith('teavm-core-') }
        if (cores.size() != 1 || cores.first().name != 'teavm-core-0.16.0.jar'
                || java.security.MessageDigest.getInstance('SHA-256').digest(cores.first().bytes).encodeHex().toString() != pin.sha256
                || pin.coordinate != 'org.teavm:teavm-core:0.16.0') {
            throw new GradleException('Compiler classpath does not contain the pinned upstream TeaVM core')
        }
        logger.lifecycle("Upstream TeaVM compiler core: ${cores.first()} SHA-256=${pin.sha256}")
    }
    doLast {
        def pin = new groovy.json.JsonSlurper().parse(pinFile)
        def generated = name == 'generateJavaScript' ? file('build/generated/teavm/js/interlis-compiler.js') : file('build/generated/teavm/wasm-gc/interlis-compiler.wasm')
        def artifactSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(generated.bytes).encodeHex().toString()
        provenance.get().asFile.with {
            parentFile.mkdirs()
            setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([core: pin, artifactSha256: artifactSha256])) + '\n', 'UTF-8')
        }
    }
}

teavm {
    all {
        mainClass = 'guru.interlis.wasm.teavm.TeaVmEntryPoint'
    }
    wasmGC {
        targetFileName = 'interlis-compiler.wasm'
        copyRuntime = true
        modularRuntime = false
    }
    js {
        targetFileName = 'interlis-compiler.js'
    }
}

def cliRuntime = files(rootProject.jenesisRuntime('interlis-compiler-cli'))
def cliVersionManifest = layout.buildDirectory.file('version-manifest.json')
def cliVersion = tasks.register('writeCliVersionManifest') {
    inputs.files(cliRuntime).withNormalizer(ClasspathNormalizer)
    outputs.file(cliVersionManifest)
    doLast {
        def version = providers.exec {
            workingDir rootProject.projectDir
            commandLine rootProject.jenesisJava, '-cp', cliRuntime.asPath,
                    'guru.interlis.cli.Main', 'version', '--json'
        }.standardOutput.asText.get()
        cliVersionManifest.get().asFile.text = version
    }
}

tasks.register('prepareBrowserHarness', Sync) {
    group = 'verification'
    description = 'Copies the browser harness, WasmGC module and runtime into build/web.'
    dependsOn 'buildWasmGC', 'buildBrowserTools', cliVersion
    inputs.file cliVersionManifest
    from 'src/main/web'
    from(layout.buildDirectory.dir('browser-tools'))
    from(layout.buildDirectory.dir('generated/teavm/wasm-gc')) {
        include 'interlis-compiler.wasm'
        include 'interlis-compiler.wasm-runtime.js'
    }
    into layout.buildDirectory.dir('web')
    inputs.file(rootProject.file('tools/release/browser-manifest.cjs'))
    doLast {
        providers.exec {
            workingDir rootProject.projectDir
            commandLine nodeExecutable.get(), rootProject.file('tools/release/browser-manifest.cjs'), layout.buildDirectory.dir('web').get().asFile,
                    cliVersionManifest.get().asFile
        }.result.get().assertNormalExitValue()
    }
}

tasks.register('teavmJsTest', Exec) {
    group = 'verification'
    dependsOn ':checkNodeRuntime', 'generateJavaScript'
    timeout = java.time.Duration.ofSeconds(60)
    workingDir = projectDir
    environment 'INTERLIS_PRODUCT_VERSION', project.version
    commandLine nodeExecutable.get(), '--test', 'test/teavm-js.test.cjs'
}

tasks.register('teavmWasmTest', Exec) {
    group = 'verification'
    dependsOn ':checkNodeRuntime', 'buildWasmGC'
    timeout = java.time.Duration.ofSeconds(60)
    workingDir = projectDir
    environment 'INTERLIS_PRODUCT_VERSION', project.version
    commandLine nodeExecutable.get(), '--experimental-wasm-exnref', '--test', 'test/teavm-wasm.test.cjs'
}

tasks.register('buildBrowserTools', Exec) {
    group = 'build'
    description = 'Checks the pinned TypeScript client and builds the browser modules.'
    dependsOn ':checkNodeRuntime'
    workingDir = projectDir
    commandLine nodeExecutable.get(), 'build-browser-tools.cjs'
}

tasks.register('browserClientTest', Exec) {
    group = 'verification'
    dependsOn 'buildBrowserTools', 'generateJavaScript'
    workingDir = projectDir
    commandLine nodeExecutable.get(), '--test', 'compiler-client.test.cjs', 'worker-host.test.cjs', 'diagram-projection.test.cjs'
}

tasks.register('browserSmoke', Exec) {
    group = 'verification'
    timeout = java.time.Duration.ofSeconds(120)
    dependsOn 'prepareBrowserHarness'
    workingDir = projectDir
    environment 'INTERLIS_BROWSER_CHECK', '0'
    commandLine nodeExecutable.get(), '--test', 'test/browser-smoke.test.cjs'
}

tasks.register('browserCheck', Exec) {
    group = 'verification'
    timeout = java.time.Duration.ofSeconds(240)
    dependsOn 'prepareBrowserHarness'
    workingDir = projectDir
    environment 'INTERLIS_BROWSER_CHECK', '1'
    commandLine nodeExecutable.get(), '--test', 'test/browser-smoke.test.cjs'
}

tasks.register('safariSmoke', Exec) {
    group = 'verification'
    timeout = java.time.Duration.ofSeconds(150)
    dependsOn 'prepareBrowserHarness'
    workingDir = projectDir
    commandLine nodeExecutable.get(), 'safari-contract.cjs'
}

tasks.named('prepareBrowserHarness') {
    from(rootProject.file('testdata/reference/unicode/17.0.0/UNICODE-LICENSE.txt'))
}
